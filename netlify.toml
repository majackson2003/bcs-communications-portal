[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "frame-ancestors https://app.bynesaints.org"

[[headers]]
  for = "/gradelink-static.html"
  [headers.values]
    # This read-only public page must also embed inside opaque-origin app views.
    # frame-ancestors * still blocks those views in WebKit.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/gradelink-static"
  [headers.values]
    # Netlify's pretty URLs also serve this page without the .html extension.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'"
