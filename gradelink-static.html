<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Byne Christian School Parent Portal</title>
    <link rel="stylesheet" href="gradelink-public.css">
    <script src="gradelink-public.js" defer></script>
  </head>
  <body>
    <header class="portal-header">
      <div class="wrap header-content">
        <a class="brand" href="gradelink-static.html">Byne Christian School</a>
        <nav class="public-nav" aria-label="Public portal pages">
          <a href="gradelink-static.html" data-view="announcements">Announcements</a>
          <a href="gradelink-static.html?page=resources" data-view="resources">Resources</a>
          <a href="gradelink-static.html?page=academic" data-view="academic">Academic Calendar</a>
          <a href="gradelink-static.html?page=athletics" data-view="athletics">Athletics Calendar</a>
        </nav>
      </div>
    </header>
    <div class="wrap status-row">
      <p data-status role="status" aria-live="polite">Loading current announcements…</p>
      <button type="button" class="text-button" data-refresh>Refresh</button>
    </div>
    <main>
      <div data-overview>
        <section class="featured-section" data-featured-section>
          <div class="wrap">
            <h1>Featured</h1>
            <div class="grid featured-grid" data-featured-grid></div>
            <p class="empty" data-featured-empty hidden>No featured announcements right now.</p>
          </div>
        </section>
        <section class="announcements-section">
          <div class="wrap">
            <h2 data-list-heading>All announcements</h2>
            <div class="toolbar" data-toolbar>
              <label>Search announcements<input type="search" data-search placeholder="Search announcements" autocomplete="off"></label>
              <label>Filter by topic<select data-filter><option value="">All topics</option></select></label>
            </div>
            <p class="results-meta" data-results></p>
            <div class="grid announcement-grid" data-grid></div>
            <p class="empty" data-empty hidden>No current announcements.</p>
            <button class="load-more" type="button" data-load-more hidden>Show more</button>
          </div>
        </section>
      </div>
      <section class="detail-page wrap" data-detail hidden aria-label="Announcement details"></section>
    </main>
    <noscript><p class="wrap">Please enable JavaScript to view current announcements.</p></noscript>
  </body>
</html>
